name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm ci --omit=dev --prefix artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: azure-function
          path: artifacts/
          retention-days: 7
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Keep the current lock authoritative and retain the pre-upgrade migration lane.
        azurerm: [locked, '4.81.0']
    env:
      ARM_SUBSCRIPTION_ID: 00000000-0000-0000-0000-000000000003
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.5
      - run: terraform fmt -check -recursive
      - name: Initialize locked provider
        if: matrix.azurerm == 'locked'
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Initialize compatibility provider
        if: matrix.azurerm != 'locked'
        env:
          AZURERM_VERSION: ${{ matrix.azurerm }}
        run: |
          # An override changes only this disposable CI checkout, never the deployment lock.
          cat > provider-compat_override.tf <<EOF
          terraform {
            required_providers {
              azurerm = {
                source  = "hashicorp/azurerm"
                version = "= ${AZURERM_VERSION}"
              }
            }
          }
          EOF
          terraform init -backend=false -input=false -upgrade
      - run: terraform validate
      - run: terraform test
